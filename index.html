<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Trenes — España</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="index">

<header>
    <h1>Horarios de Trenes</h1>
    <div class="header-operators">
        <span class="th-logo-badge"><img src="images/avant.svg" alt="Avant"></span>
        <span class="th-logo-badge"><img src="images/ave.svg" alt="AVE"></span>
        <span class="th-logo-badge"><img src="images/euromed.svg" alt="Euromed"></span>
        <span class="th-logo-badge"><img src="images/alvia.svg" alt="Alvia"></span>
        <span class="th-logo-badge"><img src="images/avlo.svg" alt="Avlo"></span>
        <span class="th-logo-badge"><img src="images/iryo.svg" alt="iryo"></span>
        <span class="th-logo-badge"><img src="images/md.svg" alt="Media Distancia"></span>
        <span class="th-logo-badge"><img src="images/ouigo.svg" alt="OUIGO"></span>
        <span class="th-logo-badge"><img src="images/ic.svg" alt="IC"></span>
        <span class="th-logo-badge"><img src="images/regional.svg" alt="Regional"></span>
    </div>
</header>

<div class="container">
    <div class="search-wrapper">
        <div class="search-fields">
            <div class="field-wrap">
                <input type="text" id="fromInput" placeholder="Origen" autocomplete="off">
                <div class="suggestions" id="fromSuggestions"></div>
            </div>

            <button id="swapBtn" type="button" aria-label="Intercambiar">⇄</button>

            <div class="field-wrap">
                <input type="text" id="toInput" placeholder="Destino" autocomplete="off">
                <div class="suggestions" id="toSuggestions"></div>
            </div>
        </div>
    </div>

    <div class="legend">
        <span><i class="dot dot-ok"></i> Con trenes</span>
        <label><input type="checkbox" id="showEmpty" checked><i class="dot dot-empty"></i> Aún sin trenes</label>
        <label><input type="checkbox" id="showNoDirect" checked><i class="dot dot-nodirect"></i> Sin trenes directos</label>
    </div>

    <div id="routes"></div>

    <a href="lista-trenes.html" class="all-trains-link">Ver lista completa de trenes →</a>
</div>

<footer>
    Datos de ejemplo · Actualiza con horarios oficiales de Renfe
</footer>
<script src="app.js"></script>
</body>
</html>
