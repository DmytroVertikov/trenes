<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Trenes — España</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>

</header>

<div class="container">
    <a href="sevilla-barcelona.html" class="route">
        <h2>Sevilla ↔ Barcelona</h2>
        <div class="train-operators">
           <img src="images/ave.svg" alt="AVE" class="operator-logo operator-ave">

    <a href="sevilla-zaragoza.html" class="route">
        <h2>Sevilla ↔ Zaragoza</h2>

        </div>

    <a href="madrid-oviedo.html" class="route">
        <h2>Madrid ↔ Oviedo</h2>
        <div class="train-operators">
           <img src="images/ave.svg" alt="AVE" class="operator-logo operator-ave">
           <img src="images/alvia.svg" alt="Alvia" class="operator-logo operator-alvia">
           <img src="images/avlo.svg" alt="Avlo" class="operator-logo operator-avlo">
        </div>

    <a href="#" class="route" style="opacity: 0.6; pointer-events: none;">

<footer>
    Datos de ejemplo · Actualiza con horarios oficiales de Renfe
