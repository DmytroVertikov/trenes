<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Админка — расписания</title>
<style>
  :root{--red:#c60b1e;--red-d:#a00918;--line:#e5e5e5;--muted:#777}
  *{box-sizing:border-box}
  body{font:15px/1.45 system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222;margin:0;padding-bottom:90px}
  h1{font-size:1.25rem;margin:0} h2{font-size:1rem;margin:0 0 10px;color:var(--red)}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .hdr{background:var(--red);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .hdr b{font-size:1.05rem;margin-right:8px} .hdr h1{color:#fff;flex:1}
  .grow{flex:1}
  input,select,button{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:inherit}
  input:focus,select:focus{outline:2px solid #f3b4ba;border-color:var(--red)}
  button{cursor:pointer;font-weight:600} button:disabled{opacity:.5;cursor:default}
  .primary{background:var(--red);border-color:var(--red);color:#fff} .primary:hover{background:var(--red-d)}
  .danger{color:var(--red);border-color:var(--red)}
  .hdr button{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
  .hdr button.on{background:#fff;color:var(--red);border-color:#fff}
  .icon{padding:5px 9px;font-weight:400}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .card.flush{padding:0;overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .fields label{display:grid;gap:4px;font-size:13px;color:var(--muted)} .fields input,.fields select{width:100%;color:#222}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{background:#fafafa;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  tr.row{cursor:pointer} tr.row:hover{background:#fff5f5}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;background:#eee;font-size:12px;color:#555}
  .stops input.st{width:100%;min-width:260px;font-size:1.15rem;padding:10px 12px;font-weight: 600;}
  .tm{display:inline-flex;align-items:center;gap:3px;font-size:1.35rem}
  .tm input{width:54px;padding:10px 2px;text-align:center;font-size:1.35rem;font-variant-numeric:tabular-nums;font-weight: 600;}
  .tm b{font-weight:700;color:var(--muted)}
  input.bad{border-color:var(--red);background:#fff5f5}
  .stops input.bad{border-color:var(--red);background:#fff5f5}
  .stops td{padding:5px 6px} .nowrap{white-space:nowrap}
  .pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;font-size:1.02rem}
  .pages label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer;line-height:1.3}
  .pages input{width:18px;height:18px;flex:none;margin-top:2px;padding:0}
  .small{font-size:13px;color:var(--muted)}
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;z-index:30}
  .actionbar div{max-width:968px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:50;max-width:min(92vw,640px);padding:10px 16px;border-radius:10px;
    background:#1f7a3a;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-line;cursor:pointer}
  #toast.err{background:#b3261e} #toast.warn{background:#9a6700}
  .login{max-width:340px;margin:12vh auto;display:grid;gap:12px}
  .login label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
  @media(max-width:600px){.wrap{padding:10px}.stops input.st{min-width:170px}.pages{gap:4px 14px;font-size:.92rem}.tm input{width:46px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">Загрузка…</div>
<script>
const db = supabase.createClient("https://kitwekuehldxtkmtacrh.supabase.co", "sb_publishable_WiNelnQznSawnLT51_yCYQ_B-ZXOFF1");
const app = document.getElementById("app");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPES = ["alvia", "ave", "avlo", "ic", "iryo", "ouigo", "regional"];
const FREQ = ["diario", "diario (exc. sáb)", "diario (exc. dom)", "lun–vie", "lun–sáb", "sábado", "dom", "sáb, dom", "lun, vie, sáb, dom"];
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function timeField(i, k, v) {
  const [h = "", m = ""] = (v || "").split(":");
  const bad = v && !TIME_RE.test(v) ? " bad" : "";
  return `<span class="tm"><input class="h${bad}" inputmode="numeric" maxlength="2" placeholder="чч" aria-label="часы" data-i="${i}" data-tk="${k}" value="${h}"><b>:</b><input class="m${bad}" inputmode="numeric" maxlength="2" placeholder="мм" aria-label="минуты" data-i="${i}" data-tk="${k}" value="${m}"></span>`;
}
function commitTime(t) {
  const w = t.closest(".tm"), h = w.querySelector(".h").value, m = w.querySelector(".m").value;
  cur.stops[t.dataset.i][t.dataset.tk] = !h && !m ? "" : h && m ? h.padStart(2, "0") + ":" + m.padStart(2, "0") : `${h}:${m}`;
  dirty = true;
}
function onTime(t) {           // ввод цифр: только цифры, 7 -> 07, автопереход к следующему полю
  const isH = t.classList.contains("h");
  let v = t.value.replace(/\D/g, "").slice(0, 2);
  if (v.length == 1 && +v > (isH ? 2 : 5)) v = "0" + v;
  t.value = v;
  commitTime(t);
  if (v.length < 2) return;
  const w = t.closest(".tm");
  if (isH) w.querySelector(".m").focus();
  else if (t.dataset.tk == "arrival") w.closest("tr").querySelector('.h[data-tk="departure"]').focus();
  else w.closest("tr").nextElementSibling?.querySelector('[data-k="stname"]')?.focus();
}
function onTimeBlur(t) {       // при уходе из поля: добиваем нулём и проверяем
  if (t.value.length == 1) t.value = "0" + t.value;
  commitTime(t);
  const val = cur.stops[t.dataset.i][t.dataset.tk], bad = !!val && !TIME_RE.test(val);
  t.closest(".tm").querySelectorAll("input").forEach((x) => x.classList.toggle("bad", bad));
}
const hhmm = (t) => (t ? t.slice(0, 5) : "");
const cityOf = (n) => n.split(/[-/]/)[0].trim();

let S = { stations: [], list: [], pages: [], ps: [], psv: [] };
let cur = null, msg = null, filter = "";
const stName = (id) => (S.stations.find((s) => s.id == id) || {}).name || "?";
const banner = () => "";
let dirty = false;
function say(text, kind = "") {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.onclick = () => t.remove(); document.body.appendChild(t); }
  t.className = kind; t.textContent = text; clearTimeout(t._h);
  if (kind != "err") t._h = setTimeout(() => t.remove(), kind == "warn" ? 14000 : 4000);
}
const stOptions = () => `<datalist id="stlist">${S.stations.map((s) => `<option value="${esc(s.name)}">`).join("")}</datalist>`;
const findStation = (v) => S.stations.find((s) => s.name.toLowerCase() == v.trim().toLowerCase());

/* Вставляет в rows станции маршрута (между первой и последней совпавшей), сохраняя порядок. Возвращает добавленные id. */
function mergeRows(rows, route) {
  const hit = route.map((id, i) => (rows.includes(id) ? i : -1)).filter((i) => i >= 0);
  if (!hit.length) return [];
  const added = [];
  for (let i = hit[0]; i <= hit.at(-1); i++) {
    if (rows.includes(route[i])) continue;
    rows.splice(rows.indexOf(route[i - 1]) + 1, 0, route[i]);
    added.push(route[i]);
  }
  return added;
}

function pageDirs() {
  const m = new Map();
  for (const r of S.ps) { const k = r.page_id + ":" + r.direction; (m.get(k) || m.set(k, []).get(k)).push(r); }
  return [...m].map(([key, rows]) => {
    rows.sort((a, b) => a.seq - b.seq);
    const p = S.pages.find((x) => x.id == rows[0].page_id);
    return { key, page_id: rows[0].page_id, direction: rows[0].direction, ids: new Set(rows.map((r) => r.station_id)),
      label: `${p.title}: ${cityOf(stName(rows[0].station_id))} → ${cityOf(stName(rows.at(-1).station_id))}`,
      sort: p.sort * 10 + rows[0].direction };
  }).sort((a, b) => a.sort - b.sort);
}

async function loadAll() {
  const q = [db.from("stations").select("*").order("name"), db.from("train_list").select("*"),
    db.from("pages").select("*").order("sort"), db.from("page_stations").select("*"), db.from("page_services").select("*")];
  const r = await Promise.all(q);
  const bad = r.find((x) => x.error);
  if (bad) throw bad.error;
  [S.stations, S.list, S.pages, S.ps, S.psv] = r.map((x) => x.data);
  S.list.sort((a, b) => parseInt(a.number.split(" ")[1]) - parseInt(b.number.split(" ")[1]) || a.freq.localeCompare(b.freq));
}

/* ---------- вход ---------- */
function renderLogin() {
  dirty = false;
  app.innerHTML = `<div class="card login"><h1 style="color:var(--red)">🚆 Админка расписаний</h1>
    <label>Email<input id="em" type="email" autocomplete="username"></label>
    <label>Пароль<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="primary" data-act="login">Войти</button></div>`;
}

/* ---------- список ---------- */
function rowsHtml() {
  const f = filter.toLowerCase();
  return S.list.filter((t) => !f || `${t.number} ${t.freq} ${t.origin} ${t.destination}`.toLowerCase().includes(f))
    .map((t) => `<tr class="row" data-act="edit" data-id="${t.id}"><td class="nowrap"><b>${esc(t.number)}</b></td>
      <td>${esc(t.origin)} → ${esc(t.destination)}</td><td class="nowrap">${esc(t.freq)}</td></tr>`).join("")
    || `<tr><td colspan="3" class="small">Ничего не найдено</td></tr>`;
}
function renderList() {
  dirty = false;
  app.innerHTML = `${tabs("trains")}<main class="wrap">
    <div class="bar"><input id="flt" class="grow" placeholder="Поиск: номер, город, периодичность (${S.list.length} поездов)" value="${esc(filter)}">
    <button class="primary" data-act="new">+ Новый поезд</button></div>
    <div class="card flush scroll"><table><thead><tr><th>Поезд</th><th>Маршрут</th><th>Периодичность</th></tr></thead>
    <tbody id="rows">${rowsHtml()}</tbody></table></div></main>`;
}

/* ---------- редактирование ---------- */
async function openTrain(id) {
  dirty = false;
  if (!id) {
    cur = { id: null, number: "", freq: "diario", type: "alvia", pages: new Set(), orig: new Set(),
      stops: [{ station_id: "", arrival: "", departure: "" }, { station_id: "", arrival: "", departure: "" }] };
  } else {
    const t = S.list.find((x) => x.id == id);
    const { data, error } = await db.from("stops").select("station_id,arrival,departure").eq("service_id", id).order("seq");
    if (error) { say(error.message, "err"); return renderList(); }
    const keys = S.psv.filter((x) => x.service_id == id).map((x) => x.page_id + ":" + x.direction);
    cur = { id, number: t.number, freq: t.freq, type: t.type, pages: new Set(keys), orig: new Set(keys),
      stops: data.map((s) => ({ station_id: s.station_id, arrival: hhmm(s.arrival), departure: hhmm(s.departure) })) };
  }
  renderEdit();
}
function renderEdit() {
  const stops = cur.stops.map((s, i) => `<tr><td class="small">${i + 1}</td>
    <td><input class="st ${s.station_id ? "" : "bad"}" list="stlist" data-i="${i}" data-k="stname" placeholder="Начни вводить станцию…" value="${esc(s.station_id ? stName(s.station_id) : "")}"></td>
    <td>${timeField(i, "arrival", s.arrival)}</td>
    <td>${timeField(i, "departure", s.departure)}</td>
    <td class="nowrap"><button class="icon" data-act="up" data-i="${i}" title="Выше">↑</button>
    <button class="icon" data-act="down" data-i="${i}" title="Ниже">↓</button>
    <button class="icon danger" data-act="del" data-i="${i}" title="Убрать">✕</button></td></tr>`).join("");
  const pages = pageDirs().map((d) => `<label><input type="checkbox" data-p="${d.key}" ${cur.pages.has(d.key) ? "checked" : ""}> ${esc(d.label)}</label>`).join("");
  app.innerHTML = `<header class="hdr"><button data-act="back">← К списку</button>
    <h1>${cur.id ? esc(cur.number) + " · " + esc(cur.freq) : "Новый поезд"}</h1></header>
    <main class="wrap">${stOptions()}
    <div class="card"><div class="fields">
      <label>Номер<input data-f="number" value="${esc(cur.number)}" placeholder="A 4181"></label>
      <label>Периодичность<input data-f="freq" list="freqs" value="${esc(cur.freq)}"></label>
      <label>Тип<select data-f="type">${TYPES.map((t) => `<option ${t == cur.type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    </div><datalist id="freqs">${FREQ.map((f) => `<option value="${f}">`).join("")}</datalist></div>
    <div class="card"><h2>Остановки по порядку маршрута</h2>
      <p class="small" style="margin:0 0 10px">На первой станции достаточно времени отправления, на последней — прибытия; если время одно, второе заполнится само.
      Нет нужной станции — просто введи новое название, админка предложит её создать.</p>
      <div class="scroll"><table class="stops"><thead><tr><th>#</th><th>Станция</th><th>Прибытие</th><th>Отправление</th><th></th></tr></thead><tbody>${stops}</tbody></table></div>
      <p style="margin:12px 0 0"><button data-act="add">+ Остановка</button></p></div>
    <div class="card"><h2>Показывать на страницах</h2><div class="pages">${pages}</div></div></main>
    <div class="actionbar"><div><button class="primary" data-act="save">Сохранить</button>
    ${cur.id ? '<button data-act="copy">Копировать как новый</button><button class="danger" data-act="remove">Удалить</button>' : ""}
    <span class="small" style="align-self:center">Ctrl+S — сохранить</span></div></div>`;
}

async function save(btn) {
  const c = cur;
  c.number = c.number.trim().replace(/\s+/g, " "); c.freq = c.freq.trim();
  if (!/^[A-Z]+ \d+$/.test(c.number)) return fail("Номер должен выглядеть как «A 4181» или «AVE 3940»");
  if (!c.freq) return fail("Укажи периодичность");
  if (c.stops.length < 2) return fail("Нужно минимум две остановки");
  const stops = [];
  for (const [i, s] of c.stops.entries()) {
    for (const k of ["arrival", "departure"])
      if (s[k] && !TIME_RE.test(s[k])) return fail(`Остановка ${i + 1}: время «${s[k]}» указано неверно (часы 00–23, минуты 00–59)`);
    const a = s.arrival || s.departure, d = s.departure || s.arrival;
    if (!s.station_id || !a) return fail(`Остановка ${i + 1}: выбери станцию и укажи время`);
    stops.push({ station_id: +s.station_id, arrival: a, departure: d });
  }
  btn.disabled = true;
  try {
    let id = c.id;
    const row = { number: c.number, freq: c.freq, type: c.type };
    if (id) { const r = await db.from("services").update(row).eq("id", id); if (r.error) throw r.error; }
    else { const r = await db.from("services").insert(row).select("id").single(); if (r.error) throw r.error; id = r.data.id; }
    const r2 = await db.rpc("save_stops", { p_service: id, p_stops: stops }); if (r2.error) throw r2.error;

    const dirs = pageDirs(), warns = [], infos = [];
    for (const k of [...c.pages].filter((k) => !c.orig.has(k))) {
      const d = dirs.find((x) => x.key == k);
      const last = Math.max(0, ...S.psv.filter((x) => x.page_id == d.page_id && x.direction == d.direction).map((x) => x.sort));
      const r = await db.from("page_services").insert({ page_id: d.page_id, direction: d.direction, sort: last + 1, service_id: id });
      if (r.error) throw r.error;
      const all = [];
      for (const r of S.ps.filter((x) => x.page_id == d.page_id).sort((x, y) => x.seq - y.seq)) (all[r.direction] ||= []).push(r.station_id);
      const route = stops.map((x) => x.station_id);
      if (!route.some((x) => all[d.direction].includes(x))) {
        warns.push(`${d.label}: ни одна остановка поезда не совпадает со строками таблицы этой страницы`);
        continue;
      }
      const added = mergeRows(all[d.direction], route);
      if (added.length) {
        const r2 = await db.rpc("save_page_stations", { p_page: d.page_id, p_dirs: all });
        if (r2.error) throw r2.error;
        const r3 = await db.from("page_stations").select("*"); if (r3.error) throw r3.error;
        S.ps = r3.data;
        infos.push(`${d.label}: в таблицу добавлены станции ${added.map(stName).join(", ")}`);
      }
    }
    for (const k of [...c.orig].filter((k) => !c.pages.has(k))) {
      const [p, dir] = k.split(":");
      const r = await db.from("page_services").delete().eq("page_id", p).eq("direction", dir).eq("service_id", id);
      if (r.error) throw r.error;
    }
    await loadAll();
    say(`Сохранено: ${c.number}` + infos.map((t) => "\n+ " + t).join("") + warns.map((t) => "\n⚠ " + t).join(""), warns.length ? "warn" : "");
    renderList();
  } catch (e) {
    btn.disabled = false;
    fail(e.code == "23505" ? "Поезд с таким номером и периодичностью уже есть" : e.message);
  }
}
function fail(text) { say(text, "err"); renderEdit(); }


/* ---------- страницы ---------- */
const tabs = (a) => `<header class="hdr"><b>🚆 Расписания</b>
  <button class="${a == "trains" ? "on" : ""}" data-act="tab-trains">Поезда</button>
  <button class="${a == "pages" ? "on" : ""}" data-act="tab-pages">Страницы</button><span class="grow"></span>
  <button data-act="logout">Выйти</button></header>`;
let pg = null;
function renderPages() {
  dirty = false;
  const rows = S.pages.map((p, i) => `<tr class="row" data-act="editpage" data-id="${p.id}"><td>${i + 1}</td>
    <td><b>${esc(p.title)}</b></td><td class="small">${esc(p.slug)}</td>
    <td class="nowrap"><button class="icon" data-act="pup" data-i="${i}">↑</button> <button class="icon" data-act="pdown" data-i="${i}">↓</button></td></tr>`).join("");
  app.innerHTML = `${tabs("pages")}<main class="wrap"><div class="bar"><h1 class="grow">Страницы (${S.pages.length})</h1>
    <button class="primary" data-act="newpage">+ Новая страница</button></div>
    <div class="card flush scroll"><table><thead><tr><th>#</th><th>Название</th><th>Адрес</th><th>Порядок на главной</th></tr></thead><tbody>${rows}</tbody></table></div></main>`;
}
function openPage(id) {
  dirty = false;
  if (!id) pg = { id: null, slug: "", title: "", dirs: [["", ""], ["", ""]] };
  else {
    const p = S.pages.find((x) => x.id == id), dirs = [];
    for (const r of S.ps.filter((x) => x.page_id == id).sort((a, b) => a.seq - b.seq)) (dirs[r.direction] ||= []).push(r.station_id);
    pg = { id, slug: p.slug, title: p.title, dirs };
  }
  renderPageEdit();
}
function renderPageEdit() {
  const url = pg.slug ? (pg.id ? `${pg.slug}.html (или page.html?p=${pg.slug})` : `page.html?p=${pg.slug}`) : "";
  const dirs = pg.dirs.map((st, d) => {
    const trains = S.psv.filter((x) => pg.id && x.page_id == pg.id && x.direction == d).sort((a, b) => a.sort - b.sort)
      .map((x) => (S.list.find((t) => t.id == x.service_id) || {}).number).join(", ");
    return `<div class="card"><h2>Направление ${d + 1}: ${st[0] ? esc(cityOf(stName(st[0]))) : "?"} → ${st.at(-1) ? esc(cityOf(stName(st.at(-1)))) : "?"}</h2>
    <p class="small" style="margin:0 0 10px">Поезда: ${esc(trains) || "пока нет (добавляются на вкладке «Поезда»)"}</p>
    <div class="scroll"><table class="stops"><tbody>${st.map((v, i) => `<tr><td class="small">${i + 1}</td>
      <td><input class="st ${v ? "" : "bad"}" list="stlist" data-ps="${d}:${i}" placeholder="Начни вводить станцию…" value="${esc(v ? stName(v) : "")}"></td>
      <td class="nowrap"><button class="icon" data-act="pstup" data-d="${d}" data-i="${i}">↑</button>
      <button class="icon" data-act="pstdown" data-d="${d}" data-i="${i}">↓</button>
      <button class="icon danger" data-act="pstdel" data-d="${d}" data-i="${i}">✕</button></td></tr>`).join("")}</tbody></table></div>
    <p style="margin:12px 0 0"><button data-act="pstadd" data-d="${d}">+ Строка (станция)</button>
    ${pg.id ? `<button data-act="pstfill" data-d="${d}">Добавить станции из поездов</button>` : ""}</p></div>`;
  }).join("");
  app.innerHTML = `<header class="hdr"><button data-act="tab-pages">← К списку страниц</button>
    <h1>${pg.id ? esc(pg.title) : "Новая страница"}</h1></header><main class="wrap">${stOptions()}
    <div class="card"><div class="fields">
      <label>Название<input data-pf="title" value="${esc(pg.title)}" placeholder="Madrid ↔ Oviedo"></label>
      <label>Адрес (латиница, без пробелов)<input data-pf="slug" value="${esc(pg.slug)}" ${pg.id ? "disabled" : ""} placeholder="madrid-oviedo"></label>
    </div>${url ? `<p class="small" style="margin:10px 0 0">Адрес страницы: ${esc(url)}</p>` : ""}</div>
    <p class="small">Строки — станции, которые показываются в таблице. Поезд показывает время только на станциях, которые есть и в его маршруте, и здесь.</p>
    ${dirs}
    <p><button data-act="dadd">+ Направление</button> ${pg.dirs.length > 1 ? '<button data-act="ddel">Удалить последнее направление</button>' : ""}</p></main>
    <div class="actionbar"><div><button class="primary" data-act="savepage">Сохранить</button>
    ${pg.id ? '<button class="danger" data-act="removepage">Удалить страницу</button>' : ""}
    <span class="small" style="align-self:center">Ctrl+S — сохранить</span></div></div>`;
}
async function fillRows(d) {
  const ids = S.psv.filter((x) => x.page_id == pg.id && x.direction == d).map((x) => x.service_id);
  if (!ids.length) return say("На этом направлении пока нет поездов", "warn");
  const r = await db.from("stops").select("service_id,seq,station_id").in("service_id", ids).order("seq");
  if (r.error) return say(r.error.message, "err");
  const by = {};
  for (const x of r.data) (by[x.service_id] ||= []).push(x.station_id);
  const rows = pg.dirs[d], added = [];
  for (const sid of ids) added.push(...mergeRows(rows, by[sid] || []));
  if (added.length) dirty = true;
  say(added.length ? `Добавлено станций: ${added.length} (${added.map(stName).join(", ")}).\nНажми «Сохранить»` : "Все станции поездов уже есть в таблице",
    added.length ? "" : "warn");
  renderPageEdit();
}
function pfail(t) { say(t, "err"); renderPageEdit(); }
async function savePage(btn) {
  pg.title = pg.title.trim(); pg.slug = pg.slug.trim();
  if (!pg.title) return pfail("Укажи название");
  if (!pg.id && !/^[a-z0-9-]+$/.test(pg.slug)) return pfail("Адрес: только латинские буквы, цифры и дефис");
  for (const [d, st] of pg.dirs.entries()) {
    if (st.length < 2 || st.some((v) => !v)) return pfail(`Направление ${d + 1}: минимум две строки, у каждой выбрана станция`);
    if (new Set(st).size != st.length) return pfail(`Направление ${d + 1}: одна станция выбрана дважды`);
  }
  btn.disabled = true;
  try {
    let id = pg.id;
    if (id) { const r = await db.from("pages").update({ title: pg.title }).eq("id", id); if (r.error) throw r.error; }
    else {
      const sort = Math.max(0, ...S.pages.map((p) => p.sort)) + 1;
      const r = await db.from("pages").insert({ slug: pg.slug, title: pg.title, sort }).select("id").single();
      if (r.error) throw r.error; id = r.data.id;
    }
    const r2 = await db.rpc("save_page_stations", { p_page: id, p_dirs: pg.dirs.map((d) => d.map(Number)) });
    if (r2.error) throw r2.error;
    const isNew = !pg.id, slug = pg.slug;
    await loadAll();
    say(isNew ? `Страница создана. Адрес: page.html?p=${slug}\nДобавь на неё поезда на вкладке «Поезда» и ссылку в index.html.` : "Сохранено");
    renderPages();
  } catch (e) { btn.disabled = false; pfail(e.code == "23505" ? "Страница с таким адресом уже есть" : e.message); }
}
async function movePage(i, delta) {
  const a = S.pages[i], b = S.pages[i + delta]; if (!b) return;
  const r1 = await db.from("pages").update({ sort: b.sort }).eq("id", a.id);
  const r2 = await db.from("pages").update({ sort: a.sort }).eq("id", b.id);
  if (r1.error || r2.error) say((r1.error || r2.error).message, "err");
  await loadAll(); renderPages();
}

/* ---------- события ---------- */
app.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (["back", "tab-trains", "tab-pages", "logout"].includes(a)) {
    if (dirty && !confirm("Есть несохранённые изменения. Выйти без сохранения?")) return;
    dirty = false;
  }
  if (a == "login") {
    const { error } = await db.auth.signInWithPassword({ email: $("#em").value, password: $("#pw").value });
    if (error) { say("Не удалось войти: " + error.message, "err"); return renderLogin(); }
    return start();
  }
  const d = +b.dataset.d;
  if (a == "logout") { await db.auth.signOut(); return renderLogin(); }
  if (a == "tab-trains") return renderList();
  if (a == "tab-pages") return renderPages();
  if (a == "editpage") return openPage(+b.dataset.id);
  if (a == "newpage") return openPage(null);
  if (a == "pup") return movePage(i, -1);
  if (a == "pdown") return movePage(i, 1);
  if (a == "pstfill") return fillRows(d);
  if (a == "pstadd") { dirty = true; pg.dirs[d].push(""); return renderPageEdit(); }
  if (a == "pstdel") { dirty = true; pg.dirs[d].splice(i, 1); return renderPageEdit(); }
  if (a == "pstup" && i > 0) { dirty = true; const r = pg.dirs[d]; [r[i - 1], r[i]] = [r[i], r[i - 1]]; return renderPageEdit(); }
  if (a == "pstdown" && i < pg.dirs[d].length - 1) { dirty = true; const r = pg.dirs[d]; [r[i + 1], r[i]] = [r[i], r[i + 1]]; return renderPageEdit(); }
  if (a == "dadd") { dirty = true; pg.dirs.push(["", ""]); return renderPageEdit(); }
  if (a == "ddel") { dirty = true; if (confirm("Удалить последнее направление? Поезда этого направления тоже будут убраны со страницы.")) pg.dirs.pop(); return renderPageEdit(); }
  if (a == "savepage") return savePage(b);
  if (a == "removepage" && confirm(`Удалить страницу «${pg.title}»? Сами поезда останутся.`)) {
    const r = await db.from("pages").delete().eq("id", pg.id);
    if (r.error) return pfail(r.error.message);
    await loadAll(); say("Страница удалена"); return renderPages();
  }
  if (a == "edit") return openTrain(+b.dataset.id);
  if (a == "new") return openTrain(null);
  if (a == "back") return renderList();
  if (a == "add") {
    cur.stops.push({ station_id: "", arrival: "", departure: "" }); dirty = true; renderEdit();
    return [...document.querySelectorAll('[data-k="stname"]')].at(-1).focus();
  }
  if (a == "copy") {
    cur = { ...cur, id: null, number: "", pages: new Set(cur.pages), orig: new Set(), stops: cur.stops.map((x) => ({ ...x })) };
    dirty = true; say("Копия создана: укажи новый номер и сохрани"); return renderEdit();
  }
  if (a == "del") { cur.stops.splice(i, 1); dirty = true; return renderEdit(); }
  if (a == "up" && i > 0) { dirty = true; [cur.stops[i - 1], cur.stops[i]] = [cur.stops[i], cur.stops[i - 1]]; return renderEdit(); }
  if (a == "down" && i < cur.stops.length - 1) { dirty = true; [cur.stops[i + 1], cur.stops[i]] = [cur.stops[i], cur.stops[i + 1]]; return renderEdit(); }
  if (a == "save") return save(b);
  if (a == "remove" && confirm(`Удалить поезд ${cur.number} (${cur.freq}) и все его остановки?`)) {
    const r = await db.from("services").delete().eq("id", cur.id);
    if (r.error) return fail(r.error.message);
    await loadAll(); say("Поезд удалён"); renderList();
  }
});
app.addEventListener("input", async (e) => {
  const t = e.target;
  if (t.dataset.tk) return onTime(t);
  if (cur && (t.dataset.f || t.dataset.k || t.dataset.pf)) dirty = true;
  if (t.dataset.pf) { pg[t.dataset.pf] = t.value; return; }
  if (t.id == "flt") { filter = t.value; $("#rows").innerHTML = rowsHtml(); }
  else if (t.dataset.f) cur[t.dataset.f] = t.value;
});
app.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.tk) return onTimeBlur(t);
  if (t.dataset.p || t.dataset.ps || t.dataset.k) dirty = true;
  if (t.dataset.ps) {
    const [d, i] = t.dataset.ps.split(":"), st = findStation(t.value);
    if (!st && t.value.trim()) say("Такой станции нет. Создай её в редакторе поезда (введи название новой станции)", "err");
    pg.dirs[d][i] = st ? st.id : ""; return renderPageEdit();
  }
  if (t.dataset.p) { t.checked ? cur.pages.add(t.dataset.p) : cur.pages.delete(t.dataset.p); }
  else if (t.dataset.k == "stname") {
    const i = t.dataset.i, v = t.value.trim(), st = findStation(v);
    if (st) cur.stops[i].station_id = st.id;
    else if (!v) cur.stops[i].station_id = "";
    else if (confirm(`Станции «${v}» нет в базе. Создать новую?`)) {
      const city = (prompt("Город для подписей «desde …»:", cityOf(v)) || cityOf(v)).trim();
      const r = await db.from("stations").insert({ name: v, city }).select().single();
      if (r.error) { say(r.error.message, "err"); cur.stops[i].station_id = ""; }
      else { S.stations.push(r.data); S.stations.sort((x, y) => x.name.localeCompare(y.name)); cur.stops[i].station_id = r.data.id; say(`Станция «${v}» создана`); }
    } else cur.stops[i].station_id = "";
    return renderEdit();
  }
});

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == "s") {
    const b = document.querySelector('[data-act="save"],[data-act="savepage"]');
    if (b) { e.preventDefault(); document.activeElement.blur(); b.click(); }
  }
  if (e.key == "Enter" && e.target.id == "pw") document.querySelector('[data-act="login"]').click();
});

document.addEventListener("focusin", (e) => { if (e.target.matches?.(".tm input")) e.target.select(); });
document.addEventListener("keydown", (e) => {
  if (e.key == "Backspace" && e.target.matches?.(".tm .m") && !e.target.value) e.target.closest(".tm").querySelector(".h").focus();
});

async function start() {
  try { await loadAll(); renderList(); }
  catch (e) { say("Не удалось загрузить данные: " + e.message, "err"); renderLogin(); }
}
db.auth.getSession().then(({ data }) => (data.session ? start() : renderLogin()));
</script>
</body>
